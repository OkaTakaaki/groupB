<!-- templates/app/home.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホーム</title>
</head>
<body>
    <h1>ユーザー一覧</h1>

    {% if users %}
        <ul>
        {% for user in users %}
            <li>
                <a href="{% url 'chat' user.id %}">
                    {{ user.username }}
                </a>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>ユーザーがいません。</p>
    {% endif %}
</body>
</html>
