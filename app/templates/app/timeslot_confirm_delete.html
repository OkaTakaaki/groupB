{% extends "base.html" %}

{% block content %}
<h2>時間帯削除確認</h2>

<p>
    本当にこの時間帯を削除しますか？
</p>

<p style="font-weight:bold;">
    {{ timeslot.name }}  
    ({{ timeslot.start_time }} - {{ timeslot.end_time }})
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">削除する</button>
    <a href="{% url 'app:timeslot_list' %}">キャンセル</a>
</form>
{% endblock %}
