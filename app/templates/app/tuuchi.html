{% extends 'base.html' %}

{% block content %}
<h1 style="text-align:center;">通知送信</h1>

<div class="notification-container">
    <form method="post">
        {% csrf_token %}

        <label for="title">通知タイトル</label>
        <input type="text" id="title" name="title" placeholder="タイトルを入力" required>

        <label for="message">通知内容</label>
        <textarea id="message" name="message" rows="5" placeholder="通知内容を入力" required></textarea>

        

        <button type="submit">送信</button>
    </form>
</div>

<style>
.notification-container {
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
    background: #f9f9f9;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.notification-container label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

.notification-container input,
.notification-container textarea,
.notification-container select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.notification-container button {
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.notification-container button:hover {
    background: #2980b9;
}
</style>
{% endblock %}
