{% extends 'base.html' %}
{% block title %}設定{% endblock %}

{% block content %}
<style>
/* ====== 設定ページ用スタイル ====== */
body {
    background-color: #f5f5f5;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
}

/* コンテナ */
.settings-container {
    max-width: 450px; /* 少し横幅アップ */
    margin: 50px auto;
}

/* メニューリスト */
.settings-list {
    display: flex;
    flex-direction: column;
    gap: 18px; /* 項目間の余白を広げる */
}

/* 各項目ボタン */
.settings-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #ffffff;
    border: 2px solid #5a82d1;
    border-radius: 40px;
    padding: 16px 22px; /* ボタンを全体的に大きく */
    font-size: 1.1em; /* テキストサイズアップ */
    text-decoration: none;
    color: #333;
    transition: all 0.2s ease;
}

.settings-item:hover {
    background: #e8f0ff;
    transform: translateY(-2px);
}

/* アイコン */
.settings-item .icon {
    font-size: 1.5em; /* アイコンを大きく */
}

/* ログアウト専用スタイル */
.logout {
    border-color: #ff7070;
    color: #ff4040;
}

.logout:hover {
    background: #ffe5e5;
}
</style>

<div class="settings-container">

    <div class="settings-list">
        <a href="{% url 'teacher_select' %}" class="settings-item">
            <span class="icon">👤</span>
            <span>講師情報の編集</span>
        </a>

        <a href="{% url 'student_select' %}" class="settings-item">
            <span class="icon">👥</span>
            <span>生徒情報の編集</span>
        </a>

        <a href="{% url 'tcaccount' %}" class="settings-item">
            <span class="icon">👤➕</span>
            <span>講師アカウントの作成</span>
        </a>

        <a href="{% url 'scaccount' %}" class="settings-item">
            <span class="icon">👥➕</span>
            <span>生徒アカウントの作成</span>
        </a>

        <a href="{% url 'logout' %}" class="settings-item logout">
            <span class="icon">🚪</span>
            <span>ログアウト</span>
        </a>
    </div>
</div>
{% endblock %}
